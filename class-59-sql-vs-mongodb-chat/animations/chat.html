<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat App: SQL vs MongoDB</title>
<link rel="stylesheet" href="net.css">
<link rel="stylesheet" href="chat.css">
<style>
.dgrid.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dgrid.two .dcard { margin: 0; }
.rws.compact { display: flex; flex-wrap: wrap; gap: 5px; }
.rws.compact .rw { margin: 0; }
.story { padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--purple-bg); font-size: 16px; line-height: 1.6; }
.story b { color: var(--purple); }
.story .ask { display: block; margin-top: 4px; }
.story .q { display: block; margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: var(--panel); border: 2px dashed var(--amber); font-size: 17px; font-weight: 600; }
.story .q b { color: var(--amber); }
.answer { padding: 16px 18px; border-top: 1px solid var(--line); background: var(--good-bg); }
.ans-h { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--good); }
.answer ul { margin: 10px 0 0; padding-left: 22px; font-size: 16px; line-height: 1.7; }
.answer ul.hidden { display: none; }
.answer li.win { list-style: none; margin: 8px 0 0 -22px; font-weight: 800; }
.answer li.win span { padding: 3px 12px; border-radius: 999px; background: var(--good); color: #fff; }
.queries.final .qt { color: var(--teal); }
.fpanel { min-width: 0; }
.fcap { color: var(--muted); font-size: 13px; font-weight: 600; margin: 4px 0 8px; }
.tname { font: 700 15px ui-monospace, Menlo, Consolas, monospace; margin: 0 0 6px; }
.ft { border-collapse: separate; border-spacing: 0; margin: 0 0 18px; font-size: 15px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.ft th { background: var(--purple-bg); color: var(--purple); font: 700 13px ui-monospace, Menlo, Consolas, monospace; text-align: left; padding: 8px 16px; }
.ft td { padding: 8px 16px; border-top: 1px solid var(--line); white-space: nowrap; }
.ft tr:nth-child(odd) td { background: var(--soft); }
.ft td.null { color: var(--muted); font-style: italic; }
.doc { margin: 0 0 12px; padding: 12px 16px; border-radius: 10px; border-left: 4px solid var(--good); background: #15191e; color: #e7e5df; font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace; white-space: pre; overflow-x: auto; }
.doc .jk { color: #8ab4f8; } .doc .js { color: #a8d8a0; } .doc .jn { color: #f5c06b; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>A chat app: SQL vs MongoDB</h1>
    <nav class="pages">
      <a href="index.html">Overview</a>
      <a class="on" href="chat.html">Chat app</a>
    </nav>
  </header>
  <div class="box">
    <div class="row"><div class="row-t">Step</div><div class="row-c" id="scen"></div></div>
    <div class="story" id="story"></div>
    <div id="msg"><div id="msgText"></div><div class="ctl"><button id="bPause"></button><button id="bStep" disabled>Next step &#8594;</button></div></div>
    <div id="stage"></div>
    <div class="queries" id="queries">
      <div><div class="qt">SQL query</div><pre id="sqlQ"></pre></div>
      <div><div class="qt">MongoDB query</div><pre id="mgQ"></pre></div>
    </div>
    <div class="queries final" id="final">
      <div><div class="qt" id="sqlFT">SQL tables after this step</div><div class="fpanel" id="sqlF"></div></div>
      <div><div class="qt" id="mgFT">MongoDB documents after this step</div><div class="fpanel" id="mgF"></div></div>
    </div>
    <div class="answer" id="answer">
      <div class="ans-h"><span>The answer</span><button id="bAns">Show answer</button></div>
      <ul id="ansList"></ul>
    </div>
    <div class="footer">
      <label>Speed <input id="speed" type="range" min="0.4" max="3" step="0.1" value="1" autocomplete="off"></label>
      <span class="hint">Space = start / pause, &#8594; = next step</span>
      <span class="sp"></span>
      <button id="bRestart">Restart</button>
    </div>
  </div>
</div>

<script src="net-core.js"></script>
<script>
const $ = s => document.querySelector(s);
Net.mount(676, 1.1);

// ---------- the people and their reactions ----------
const EMO = { like: '👍', love: '❤️', laugh: '😂', wow: '😮' };
const TS = 14, TM = 346, LS = TS + 158, LM = TM + 158;   // lane tops and lane centres

// ---------- small view helpers ----------
const T = {}, D = {};
const setQ = (side, text) => { $('#' + side + 'Q').textContent = text || ''; };
// The "final data" panel: SQL tables drawn as text, MongoDB documents as formatted JSON.
const esc = v => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const cap = t => `<div class="fcap">${t}</div>`;
function tbl(name, cols, rows) {
  const head = '<tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr>';
  const body = rows.length
    ? rows.map(r => '<tr>' + r.map(v => `<td class="${v === 'NULL' ? 'null' : ''}">${esc(v)}</td>`).join('') + '</tr>').join('')
    : `<tr><td class="null" colspan="${cols.length}">empty</td></tr>`;
  return `<div class="tname">${name}</div><table class="ft">${head}${body}</table>`;
}
// JSON with colours; small objects stay on one line so a document reads like a card.
function jh(v, ind) {
  if (v === null || typeof v !== 'object') return typeof v === 'string' ? `<span class="js">"${esc(v)}"</span>` : `<span class="jn">${v}</span>`;
  const arr = Array.isArray(v);
  const items = arr ? v.map(x => jh(x, ind + '  ')) : Object.keys(v).map(k => `<span class="jk">"${k}"</span>: ` + jh(v[k], ind + '  '));
  const o = arr ? '[' : '{', c = arr ? ']' : '}';
  if (!items.length) return o + c;
  if (ind && JSON.stringify(v).length <= 44) return o + ' ' + items.join(', ') + ' ' + c;
  return o + '\n' + items.map(t => ind + '  ' + t).join(',\n') + '\n' + ind + c;
}
const json = v => (Array.isArray(v) ? v : [v]).map(d => `<pre class="doc">${jh(d, '')}</pre>`).join('');
function setF(sqlHTML, mgHTML, sqlTitle, mgTitle) {
  $('#final').classList.toggle('hidden', !sqlHTML && !mgHTML);
  $('#sqlF').innerHTML = sqlHTML || '';
  $('#mgF').innerHTML = mgHTML || '';
  $('#sqlFT').textContent = sqlTitle || 'SQL tables after this step';
  $('#mgFT').textContent = mgTitle || 'MongoDB documents after this step';
}
const MCOLS = ['id', 'sender', 'text'], RCOLS = ['message_id', 'user', 'emoji'];
const screen = html => `<div class="screen">${html}</div>`;
const chips = rx => `<div class="rxs">${rx.map(r => `<span class="re ${r.s || ''}">${EMO[r.e]} ${r.u}</span>`).join('')}</div>`;
const bubble = (text, rx) => `<div class="bubble">${text}${rx && rx.length ? chips(rx) : ''}</div>`;
const big = (v, unit) => `<div class="big">${v}<small>${unit || ''}</small></div>`;

function lanes(sqlLabel, mgLabel) {
  Net.group({ x: 16, y: TS, w: 968, h: 318, label: sqlLabel || 'SQL: separate tables' });
  Net.group({ x: 16, y: TM, w: 968, h: 318, label: mgLabel || 'MongoDB: one document per message' });
}
function app(id, x, y) {
  Net.node(id, { x, y, label: 'Chat app', kind: 'client', w: 200, body: screen('<span class="wait-t">waiting…</span>') });
}
function show(id, html) { Net.set(id, { body: screen(html) }); }
function counter(id, x, y, label, v, unit) { Net.node(id, { x, y, label, kind: 'count', w: 150, body: big(v, unit) }); }
function setC(id, label, v, unit) { Net.set(id, { label, body: big(v, unit) }); }
const win = (...ids) => ids.forEach(id => Net.set(id, { state: 'win' }));

// A table: rows are shown as chips; each row has a state (new, read, bad, dim, link, gone).
function rowsHTML(id) {
  const rows = T[id].rows;
  if (!rows.length) return '<div class="none">empty</div>';
  return `<div class="rws ${T[id].compact ? 'compact' : ''}">${rows.map(r => `<div class="rw ${r.s}">${r.t}</div>`).join('')}</div>`;
}
function table(id, x, y, title, cols, rows, o = {}) {
  T[id] = { rows: rows.map(t => ({ t, s: '' })), compact: o.compact };
  Net.node(id, { x, y, label: title, sub: cols, kind: 'db', w: o.w || 300, body: rowsHTML(id) });
}
const paintT = id => Net.set(id, { body: rowsHTML(id) });
function addRow(id, t) { T[id].rows.push({ t, s: 'new' }); paintT(id); }
function markRows(id, test, s) { T[id].rows.forEach((r, i) => { if (test(r, i)) r.s = s; }); paintT(id); }
async function dropRows(ctx, id, test) {
  markRows(id, test, 'bad');
  await Net.wait(ctx, 700);
  markRows(id, test, 'gone');
  await Net.wait(ctx, 450);
  T[id].rows = T[id].rows.filter((r, i) => !test(r, i));
  paintT(id);
}

// A collection: each document is a card (text + reaction chips inside it).
function docHTML(d) {
  const main = d.voice ? `🎤 voice note · ${d.voice} s` : (d.poll ? '📊 ' : '') + `“${d.text}”`;
  return `<div class="dcard ${d.s || ''}"><div class="dh"><span>document ${d.id}</span>${d.tag ? `<span class="tag">${d.tag}</span>` : ''}</div>`
    + `<div class="dt">${main} <span style="font-weight: 400; color: var(--muted)">· ${d.from}</span></div>`
    + (d.poll ? `<div class="rxs">${d.poll.map(o => `<span class="re new">🗳 ${o}</span>`).join('')}</div>` : '')
    + (d.rx && d.rx.length ? chips(d.rx) : '') + '</div>';
}
function collection(id, x, y, docs, o = {}) {
  D[id] = { docs, grid: o.grid };
  Net.node(id, { x, y, label: o.title || 'messages', sub: 'collection', kind: 'lb', w: o.w || 340, body: docsHTML(id) });
}
function docsHTML(id) {
  const c = D[id];
  return c.docs.length ? `<div class="dgrid ${c.grid ? 'two' : ''}">${c.docs.map(docHTML).join('')}</div>` : '<div class="none">empty</div>';
}
const paintD = id => Net.set(id, { body: docsHTML(id) });

const say = (html, kind) => Net.say(html, kind);
const send = (a, b, label, cls, dur) => Net.send(a, b, { label, cls: cls || '', dur: dur || 1100 });

// ================= Step 1: send a message, then a reaction arrives later =================
function setup1() {
  lanes();
  app('sA', 140, LS);
  table('msgs', 520, TS + 77, 'messages table', 'id · sender · text', []);
  table('rx', 520, TS + 220, 'reactions table', 'message · user · emoji', []);
  counter('sC', 870, LS, 'Writes', 0);
  Net.link('sA', 'msgs');
  Net.link('sA', 'rx');
  app('mA', 140, LM);
  collection('col', 520, LM, []);
  counter('mC', 870, LM, 'Writes', 0);
  Net.link('mA', 'col');
  setQ('sql', "INSERT INTO messages (id, sender, text)\nVALUES (101, 'Rahul', 'Movie tonight?');\n\n-- a minute later, Aman reacts:\nINSERT INTO reactions (message_id, user, emoji)\nVALUES (101, 'Aman', 'like');");
  setF(tbl('messages', MCOLS, [[101, 'Rahul', 'Movie tonight?']]) + tbl('reactions', RCOLS, [[101, 'Aman', 'like']]),
    cap('collection: messages') + json({ _id: 101, from: 'Rahul', text: 'Movie tonight?', reactions: [{ user: 'Aman', emoji: 'like' }] }));
  setQ('mg', 'db.messages.insertOne({\n  "_id": 101,\n  "from": "Rahul",\n  "text": "Movie tonight?"\n})\n\n// a minute later, Aman reacts:\ndb.messages.updateOne(\n  { "_id": 101 },\n  { "$push": { "reactions": { "user": "Aman", "emoji": "like" } } }\n)');
}
async function run1(ctx) {
  show('sA', bubble('Movie tonight?'));
  show('mA', bubble('Movie tonight?'));
  say('Rahul sends <b>“Movie tonight?”</b>. Both sides save the new message.');
  await Net.beat(ctx);

  say('<b>Write 1, on both sides:</b> SQL adds a row to the messages table; MongoDB adds a new document.');
  await Promise.all([send('sA', 'msgs', 'INSERT message'), send('mA', 'col', 'insertOne message')]);
  Net.check(ctx);
  addRow('msgs', '101 · Rahul · “Movie tonight?”');
  D.col.docs = [{ id: 101, from: 'Rahul', text: 'Movie tonight?', rx: [], s: 'new' }];
  paintD('col');
  setC('sC', 'Writes', 1);
  setC('mC', 'Writes', 1);
  await Net.beat(ctx);

  show('sA', bubble('Movie tonight?', [{ u: 'Aman', e: 'like', s: 'new' }]));
  show('mA', bubble('Movie tonight?', [{ u: 'Aman', e: 'like', s: 'new' }]));
  say('<b>A minute later</b>, Aman reacts 👍. It is a separate event, so it is a <b>separate write</b> on both sides.');
  await Net.beat(ctx, 2200);

  say('<b>SQL</b> inserts a new row into the reactions table. <b>MongoDB</b> updates the message document: the reaction goes <b>inside</b> it, so the document is rewritten.');
  await Promise.all([send('sA', 'rx', 'INSERT reaction'), send('mA', 'col', 'updateOne: $push reaction')]);
  Net.check(ctx);
  addRow('rx', '101 · Aman · 👍');
  D.col.docs[0] = { id: 101, from: 'Rahul', text: 'Movie tonight?', rx: [{ u: 'Aman', e: 'like', s: 'new' }], s: 'rewrite', tag: 'rewritten' };
  paintD('col');
  setC('sC', 'Writes', 2, 'insert + insert');
  setC('mC', 'Writes', 2, 'insert + update');
  await Net.beat(ctx);

  win('sC', 'mC');
  say('<b>A tie: 2 writes each.</b> The difference is <b>where</b> the reaction lives: SQL adds a separate small row, MongoDB rewrites the message to put it inside. That choice decides the steps that follow.', 'win');
}

// ================= Step 2: read the message back =================
const RX3 = [{ u: 'Aman', e: 'like' }, { u: 'Zoya', e: 'love' }, { u: 'Om', e: 'laugh' }];
function setup2() {
  lanes();
  app('sA', 140, LS);
  table('msgs', 520, TS + 77, 'messages table', 'id · sender · text', ['101 · Rahul · “Movie tonight?”']);
  table('rx', 520, TS + 220, 'reactions table', 'message · user · emoji', ['101 · Aman · 👍', '101 · Zoya · ❤️', '101 · Om · 😂']);
  counter('sC', 870, LS, 'Rows back', 0);
  Net.link('sA', 'msgs');
  Net.link('sA', 'rx');
  app('mA', 140, LM);
  collection('col', 520, LM, [{ id: 101, from: 'Rahul', text: 'Movie tonight?', rx: RX3 }]);
  counter('mC', 870, LM, 'Documents back', 0);
  Net.link('mA', 'col');
  setQ('sql', 'SELECT m.text, r.user, r.emoji\nFROM messages m\nLEFT JOIN reactions r ON r.message_id = m.id\nWHERE m.id = 101;');
  setQ('mg', 'db.messages.findOne({ "_id": 101 })');
  setF(cap('what comes back: 3 rows, the text repeated in every row') + tbl('result', ['text', 'user', 'emoji'], [['Movie tonight?', 'Aman', 'like'], ['Movie tonight?', 'Zoya', 'love'], ['Movie tonight?', 'Om', 'laugh']])
      + cap('the tables (unchanged, this is a read)') + tbl('messages', MCOLS, [[101, 'Rahul', 'Movie tonight?']]) + tbl('reactions', RCOLS, [[101, 'Aman', 'like'], [101, 'Zoya', 'love'], [101, 'Om', 'laugh']]),
    cap('what comes back: 1 document, already in the shape the screen needs') + json({ _id: 101, from: 'Rahul', text: 'Movie tonight?', reactions: [{ user: 'Aman', emoji: 'like' }, { user: 'Zoya', emoji: 'love' }, { user: 'Om', emoji: 'laugh' }] }),
    'SQL result + tables', 'MongoDB result');
}
async function run2(ctx) {
  say('Someone opens the chat. The message now has <b>3 reactions</b>. Both apps must show it.');
  await Net.beat(ctx);

  say('<b>SQL</b> joins the two tables. The answer comes back as <b>one row per reaction</b>, with the message text repeated on each.');
  await send('sA', 'rx', 'JOIN messages + reactions');
  markRows('msgs', () => true, 'read');
  for (let i = 0; i < 3; i++) {
    markRows('rx', (r, k) => k === i, 'read');
    await send('rx', 'sA', `“Movie tonight?” + ${EMO[RX3[i].e]}`, 'amber', 900);
    setC('sC', 'Rows back', i + 1);
    show('sA', `<span class="wait-t">${i + 1} row${i ? 's' : ''} received…</span>`);
  }
  say('The app now has <b>3 rows</b> and has to fold them back into one message.');
  await Net.beat(ctx, 2000);
  show('sA', bubble('Movie tonight?', RX3));
  await Net.beat(ctx, 1600);

  say('<b>MongoDB</b> sends back the document <b>exactly as stored</b>: one message, reactions inside.');
  await send('mA', 'col', 'findOne 101');
  D.col.docs[0].s = 'read';
  paintD('col');
  await send('col', 'mA', 'the whole message', 'teal');
  setC('mC', 'Documents back', 1);
  show('mA', bubble('Movie tonight?', RX3));
  await Net.beat(ctx);

  win('mC');
  say('<b>MongoDB.</b> The data arrives <b>in the shape the screen needs</b>. SQL flattens it into rows that the app must rebuild.', 'win');
}

// ================= Step 3: send a poll (its options are born with it) =================
function setup3() {
  lanes();
  app('sA', 140, LS);
  table('msgs', 520, TS + 77, 'messages table', 'id · sender · text', []);
  table('opts', 520, TS + 220, 'poll_options table', 'message · option', []);
  counter('sC', 870, LS, 'Writes', 0);
  Net.link('sA', 'msgs');
  Net.link('sA', 'opts');
  app('mA', 140, LM);
  collection('col', 520, LM, []);
  counter('mC', 870, LM, 'Writes', 0);
  Net.link('mA', 'col');
  setQ('sql', "START TRANSACTION;\n\nINSERT INTO messages (id, sender, text)\nVALUES (102, 'Om', 'Which show?');\n\nINSERT INTO poll_options (message_id, option_text)\nVALUES (102, '7 PM'), (102, '10 PM');\n\nCOMMIT;\n-- if anything fails: ROLLBACK;");
  setF(tbl('messages', MCOLS, [[102, 'Om', 'Which show?']]) + tbl('poll_options', ['message_id', 'option_text'], [[102, '7 PM'], [102, '10 PM']]),
    cap('collection: messages') + json({ _id: 102, from: 'Om', text: 'Which show?', poll: ['7 PM', '10 PM'] }));
  setQ('mg', 'db.messages.insertOne({\n  "_id": 102,\n  "from": "Om",\n  "text": "Which show?",\n  "poll": ["7 PM", "10 PM"]\n})');
}
async function run3(ctx) {
  const pollBubble = '<div class="bubble">📊 Which show?<div class="rxs"><span class="re">7 PM</span><span class="re">10 PM</span></div></div>';
  show('sA', pollBubble);
  show('mA', pollBubble);
  say('Om sends a <b>poll</b>: “Which show?” with options <b>7 PM</b> and <b>10 PM</b>. Unlike a reaction, the options are <b>created together with the message</b>: a poll without its options makes no sense.');
  await Net.beat(ctx);

  say('<b>SQL</b> keeps options in their own table, so it needs <b>two writes</b>, inside a transaction so a half-saved poll can never appear.');
  Net.set('sA', { badge: 'transaction' });
  await send('sA', 'msgs', 'INSERT message');
  addRow('msgs', '102 · Om · 📊 “Which show?”');
  setC('sC', 'Writes', 1);
  await send('sA', 'opts', 'INSERT options');
  addRow('opts', '102 · 7 PM');
  addRow('opts', '102 · 10 PM');
  setC('sC', 'Writes', 2, '2 tables + transaction');
  await Net.beat(ctx, 2200);

  say('<b>MongoDB</b> stores the poll with its options as <b>one document</b>: one write, and it is saved completely or not at all.');
  await send('mA', 'col', 'insertOne poll + options');
  D.col.docs = [{ id: 102, from: 'Om', text: 'Which show?', poll: ['7 PM', '10 PM'], s: 'new' }];
  paintD('col');
  setC('mC', 'Writes', 1, 'no transaction needed');
  await Net.beat(ctx);

  win('mC');
  say('<b>MongoDB: 1 write instead of 2</b>, when the parts are <b>born together</b>. Every extra part (an image with a caption, a poll with options) is another SQL table to write to.', 'win');
}

// ================= Step 3b: a viral message =================
const FANS = ['Riya', 'Dev', 'Isha', 'Kabir', 'Tara', 'Neel'];
const FAN_POS = [[70, 80], [175, 80], [70, 158], [175, 158], [70, 236], [175, 236]];
function setup3b() {
  lanes();
  FANS.forEach((f, i) => Net.node('sf' + i, { x: FAN_POS[i][0], y: TS + FAN_POS[i][1], label: f, kind: 'client small', w: 84 }));
  table('rx', 560, LS, 'reactions table', 'message · user · emoji', ['101 · Aman · 👍'], { compact: true, w: 330 });
  counter('sC', 880, LS, 'Rounds', 0);
  FANS.forEach((f, i) => Net.node('mf' + i, { x: FAN_POS[i][0], y: TM + FAN_POS[i][1], label: f, kind: 'client small', w: 84 }));
  Net.node('queue', { x: 395, y: LM, label: 'Waiting in line', kind: 'proxy', w: 170, body: '<div class="none">nobody yet</div>' });
  collection('col', 655, LM, [{ id: 101, from: 'Rahul', text: 'Movie tonight?', rx: [{ u: 'Aman', e: 'like' }] }], { w: 270 });
  counter('mC', 880, LM, 'Rounds', 0);
  Net.link('queue', 'col');
  setQ('sql', "-- 6 of these arrive at the same moment\nINSERT INTO reactions (message_id, user, emoji)\nVALUES (101, 'Riya', 'like');");
  setF(tbl('reactions', RCOLS, [[101, 'Aman', 'like']].concat(FANS.map(f => [101, f, 'like']))) + cap('6 new rows, written side by side'),
    cap('collection: messages  (one document, rewritten 6 times)') + json({ _id: 101, from: 'Rahul', text: 'Movie tonight?', reactions: [{ user: 'Aman', emoji: 'like' }].concat(FANS.map(f => ({ user: f, emoji: 'like' }))) }));
  setQ('mg', '// 6 of these arrive at the same moment\ndb.messages.updateOne(\n  { "_id": 101 },\n  { "$push": { "reactions": { "user": "Riya", "emoji": "like" } } }\n)');
}
async function run3b(ctx) {
  say('The message goes <b>viral</b>: 6 people react <b>at the same moment</b>. (Imagine 6,000.)');
  await Net.beat(ctx);

  say('<b>SQL:</b> each reaction is <b>its own row</b>, so all 6 are written <b>side by side</b>. Nobody waits.');
  await Promise.all(FANS.map((f, i) => send('sf' + i, 'rx', '👍', '', 1100)));
  Net.check(ctx);
  FANS.forEach(f => addRow('rx', '101 · ' + f + ' · 👍'));
  setC('sC', 'Rounds', 1, 'all at once');
  await Net.beat(ctx);

  say('<b>MongoDB:</b> all 6 want to change <b>the same document</b>. Only one change at a time, so they <b>queue up</b>...');
  await Promise.all(FANS.map((f, i) => send('mf' + i, 'queue', '👍', '', 1100)));
  Net.check(ctx);
  const waiting = FANS.map(f => ({ u: f, e: 'like', s: 'wait' }));
  Net.set('queue', { body: chips(waiting) });
  await Net.beat(ctx, 2000);

  say('...and each one, in turn, <b>rewrites the whole document</b>, which gets bigger every time.');
  const doc = D.col.docs[0];
  for (let k = 0; k < FANS.length; k++) {
    waiting[k].s = 'new';
    Net.set('queue', { body: chips(waiting.slice(k)) });
    await send('queue', 'col', FANS[k] + ' 👍', 'amber', 700);
    doc.rx = doc.rx.map(r => ({ u: r.u, e: r.e }));
    doc.rx.push({ u: FANS[k], e: 'like', s: 'new' });
    doc.s = 'rewrite';
    doc.tag = `rewrite ${k + 1} of 6`;
    paintD('col');
    setC('mC', 'Rounds', k + 1, 'one at a time');
  }
  Net.set('queue', { body: '<div class="none">empty</div>' });
  await Net.beat(ctx);

  win('sC');
  say('<b>SQL wins for viral messages.</b> Separate rows are written side by side; one shared document becomes a queue, and keeps growing (a document can\'t exceed 16 MB). Real apps then keep reactions separate even in MongoDB, with just a count inside the message.', 'win');
}

// ---------- the question before each step, and the answer after it ----------
const QA = [
  { q: 'The reaction arrives a minute after the message. Does keeping reactions inside the message save any work here?',
    a: ['SQL: 2 INSERTs. MongoDB: insertOne + updateOne. Both do <b>2 writes</b>.',
        'Each write touches one place, so neither side needs a transaction.',
        'Simple writes that happen at different times cost the same in both.',
        'So writing is not the reason to pick one. The next steps decide it.'],
    win: 'Tie' },
  { q: 'The screen needs the message and its reactions together. Which database hands them over ready to show?',
    a: ['SQL joins 2 tables and returns <b>3 rows</b>, with the message text repeated in each one.',
        'The app has to glue those rows back into one message.',
        'MongoDB returns <b>1 document</b> that already looks like the screen.',
        'A chat is opened far more often than it is written to, so this saving repeats all day.'],
    win: 'MongoDB' },
  { q: 'Poll options are created with the poll and never live without it. Is it worth spreading one poll over 2 tables?',
    a: ['SQL: 2 tables, 2 INSERTs, and a <b>transaction</b> so a poll never exists without its options.',
        'MongoDB: <b>1 insert</b>. One document is saved all-or-nothing by itself.',
        'Data that is born together and read together belongs together.'],
    win: 'MongoDB' },
  { q: '6 people react to the same message in the same second. What happens when all of them must change one document?',
    a: ['SQL: each reaction is a <b>new row</b>, so all 6 are written side by side.',
        'MongoDB: all 6 change the <b>same document</b>, so they wait in line, one at a time.',
        'The document keeps growing with every reaction (limit: 16 MB).',
        'Embedding breaks when one item gets many writes at once, or grows without limit.',
        'Real apps keep such data in its own collection and store only a count in the message.'],
    win: 'SQL' },
  { q: 'Rahul deletes his message. How many places must be cleaned up, and what if it stops half-way?',
    a: ['SQL: delete from <b>2 tables</b>, inside a transaction, or reactions are left behind with no message.',
        'MongoDB: <b>1 deleteOne</b>. The reactions are inside, so they go with it.',
        'What belongs to one thing should disappear with it.'],
    win: 'MongoDB' },
  { q: 'The data is split across servers by chat. Will a message\'s reactions end up on the same server as the message?',
    a: ['Messages are placed by chat_id. The SQL reactions table has no chat_id, so its rows land on <b>another server</b>.',
        'Reading or deleting one message then needs 2 servers.',
        'The SQL fix: copy chat_id into <b>every child table</b> (co-location). Done by hand, table by table.',
        'MongoDB: the reactions live inside the message, so they always sit on the same server for free.'],
    win: 'MongoDB' },
  { q: 'A new kind of message needs new fields. What must change in the database before the feature can ship?',
    a: ['SQL: a new table (or new columns) created on <b>every server</b> before release.',
        'Every voice note is now 2 writes in a transaction, and opening a chat needs 1 more query.',
        'MongoDB: just save a document with the new fields. Old documents stay as they are.',
        'The app must cope with old documents that don\'t have the new fields.'],
    win: 'MongoDB' },
  { q: 'Now the question is about a person, not a message. In which design do Zoya\'s reactions sit in one place?',
    a: ['SQL: the reactions table holds Zoya\'s rows; with an index on user, it reads <b>only her 3 rows</b>.',
        'MongoDB: her reactions are scattered inside many messages, so it opens <b>whole messages</b> and picks hers out.',
        'Embedding is built for one way of looking at data (by message). Other angles cost more.'],
    win: 'SQL' },
  { q: 'Zoya changes her name. If her name was copied into every message, how many places need fixing?',
    a: ['SQL: the name is stored <b>once</b> in users. 1 row changes; messages only point to user 44.',
        'MongoDB: the name was copied into every message, so <b>every one</b> must be rewritten (millions for an active user).',
        'Copying shared data that changes is expensive.',
        'The fix in MongoDB: store only the user id in the message, just like SQL does.'],
    win: 'SQL' },
  { q: 'Looking at every step: when does MongoDB win, and when does SQL win?',
    a: ['MongoDB wins when you work with <b>one thing as a whole</b>: read it, create it, delete it, give it new fields, split it across servers.',
        'SQL wins when you ask <b>across many things</b> (Zoya\'s stats), change <b>shared data</b> (her name), or many people write to <b>one item</b> at once (viral).',
        'Rule: store together what belongs to one thing and is used together. Keep shared data that changes in one place, and point to it.'],
    win: '' }
];
let ansOpen = false;
function paintAnswer(i, open) {
  ansOpen = open;
  const qa = QA[i];
  $('#ansList').innerHTML = qa.a.map(t => `<li>${t}</li>`).join('') + (qa.win ? `<li class="win">Winner: <span>${qa.win}</span></li>` : '');
  $('#ansList').classList.toggle('hidden', !open);
  $('#bAns').textContent = open ? 'Hide answer' : 'Show answer';
}
document.addEventListener('net:step', e => {
  const i = e.detail.i, st = $('#story');
  if (e.detail.state === 'select') st.innerHTML += `<span class="q"><b>Think first:</b> ${QA[i].q}</span>`;
  paintAnswer(i, e.detail.state === 'done');
});
$('#bAns').onclick = () => { const b = document.querySelector('[data-s].on'); paintAnswer(b ? +b.dataset.s : 0, !ansOpen); };
