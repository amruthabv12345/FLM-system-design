<style>
.tabs { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px; border-bottom: 1px solid var(--line); }

.intro code { color: #ffb3ba; }
.note { padding: 10px 16px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
.note code { color: #b9fff1; }
.wrapT { padding: 6px 16px 18px; overflow-x: auto; }
table.cmds { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14.5px; }
.cmds th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 12px 8px; border-bottom: 1px solid var(--line); }
.cmds td { padding: 10px 12px; border-bottom: 1px solid rgba(255, 255, 255, .05); vertical-align: top; }
.cmds tr:hover td { background: rgba(167, 139, 250, .05); }
.cmds td.n { color: var(--muted); font-size: 12px; width: 28px; }
.cmds td.c { width: 36%; }
.cmds td.o { width: 26%; }
.cmd { display: inline-block; font: 600 13.5px "JetBrains Mono", ui-monospace, monospace; color: #e4dcff; background: rgba(124, 58, 237, .14); border: 1px solid rgba(167, 139, 250, .35);
  padding: 5px 10px; border-radius: 8px; cursor: pointer; white-space: pre-wrap; word-break: break-word; transition: all .2s; }
.cmd:hover { border-color: #a78bfa; box-shadow: 0 0 14px rgba(167, 139, 250, .4); }
.cmd .k { color: #ff8a95; }
.out { margin: 0; font: 13px/1.5 "JetBrains Mono", ui-monospace, monospace; color: #a8f0b8; white-space: pre-wrap; }
.out.err { color: #fb7185; }
.out.var { color: #fbbf24; }
.cmds tr.g td { padding: 18px 12px 6px; border-bottom: 0; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #5eead4; }
.cmds tr.g:hover td { background: none; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 12px 16px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }
.legend span i { font-style: normal; font-family: "JetBrains Mono", monospace; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; background: linear-gradient(135deg, #16a34a, #4ade80);
  color: #fff; font-weight: 700; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.on { opacity: 1; }
@media (max-width: 900px) { .intro { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Redis commands, type by type</h1>
    <nav class="pages">

<script>

const $ = s => document.querySelector(s);
const esc = v => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;');
// colour the key in each command so students see the naming pattern
const paintCmd = c => esc(c).replace(/^(\S+)(\s+)(\S+)/, (m, a, sp, k) => a + sp + (/^[a-z]/.test(k) ? `<span class="k">${k}</span>` : k));

function show(i) {
  const T = TABS[i];
  document.querySelectorAll('#tabs button').forEach((b, j) => b.classList.toggle('primary', j === i));
  $('#intro').innerHTML = `<div><b>What it is</b>${T.is}</div><div><b>Think of it as</b>${T.like}</div><div><b>Use it for</b>${T.use}</div>`;
  let n = 0;
  $('#table').innerHTML = '<tr><th>#</th><th>Command</th><th>What it does</th><th>Expected output</th></tr>'
    + T.rows.map(r => {
      if (typeof r === 'string') return `<tr class="g"><td colspan="4">${r}</td></tr>`;
      n++;
      return `<tr><td class="n">${n}</td><td class="c"><span class="cmd" data-c="${esc(r[0])}">${paintCmd(r[0])}</span></td>`
        + `<td>${r[1]}</td><td class="o"><pre class="out ${r[3] || ''}">${esc(r[2])}</pre></td></tr>`;
    }).join('');
  try { localStorage.setItem('redisTab', i); } catch (e) {}
}

$('#tabs').innerHTML = TABS.map((T, i) => `<button data-i="${i}">${T.name}</button>`).join('');
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) show(+b.dataset.i); };
$('#table').onclick = e => {
  const c = e.target.closest('.cmd');
  if (!c) return;
  const done = () => { $('#toast').classList.add('on'); setTimeout(() => $('#toast').classList.remove('on'), 900); };
  if (navigator.clipboard) navigator.clipboard.writeText(c.dataset.c).then(done, () => {});
};
let start = 0;
try { start = +(localStorage.getItem('redisTab') || 0); } catch (e) {}
show(start < TABS.length ? start : 0);
</script>
